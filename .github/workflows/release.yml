name: Release

# Flutter desktop bundles are host-specific: Windows needs Visual Studio on
# Windows and macOS needs Xcode on macOS. Each platform is therefore built on a
# native runner, and the per-platform manifests are merged before publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to build, e.g. 1.1.0-alpha"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  FLUTTER_VERSION: "3.44.4"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          # macos-x64 is absent on purpose: the macos-13 runner that could build
          # an Intel bundle has been retired, so the job waits forever for a
          # machine that no longer exists.
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "value=${VERSION:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # The runners ship different Python majors and Windows has no python3
      # alias, so pin one interpreter and call it as "python" everywhere.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Fetch Flutter packages
        working-directory: frontend
        run: flutter pub get

      - name: Build release
        run: |
          python quikinstall/build_release.py \
            --version "${{ steps.version.outputs.value }}" \
            --target "${{ matrix.target }}" \
            --base-url 'https://github.com/${{ github.repository }}/releases/download/v{version}'

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: quikinstall/releases/${{ steps.version.outputs.value }}/
          if-no-files-found: error
          retention-days: 7

      - name: Upload platform manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: quikinstall/manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve version
        id: version
        run: echo "value=${VERSION:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: archives
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests

      - name: Merge platform manifests
        run: |
          python quikinstall/merge_manifests.py \
            manifests/manifest-*/manifest.json \
            --output quikinstall/manifest.json
          cat quikinstall/manifest.json

      # Assets must be reachable before the manifest names them, otherwise every
      # client resolves the advertised update to a 404.
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          shopt -s nullglob
          assets=(archives/*.tar.gz archives/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release archives were produced." >&2
            exit 1
          fi
          prerelease=false
          case "${{ steps.version.outputs.value }}" in *-*) prerelease=true ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              --prerelease="$prerelease" "${assets[@]}"
          fi

      - name: Verify every advertised asset resolves
        run: |
          python - <<'PY' > urls.txt
          import json
          manifest = json.load(open("quikinstall/manifest.json"))
          for asset in manifest["assets"].values():
              print(asset["url"])
          PY
          while read -r url; do
            echo "checking $url"
            curl -fsSL --retry 5 --retry-delay 5 -o /dev/null "$url"
          done < urls.txt

      - name: Commit the manifest
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          python quikinstall/merge_manifests.py \
            manifests/manifest-*/manifest.json \
            --output quikinstall/manifest.json
          if git diff --quiet -- quikinstall/manifest.json; then
            echo "Manifest already published."
            exit 0
          fi
          git add quikinstall/manifest.json
          git commit -m "Publish update manifest for v${{ steps.version.outputs.value }}"
          git push origin "$BRANCH"
